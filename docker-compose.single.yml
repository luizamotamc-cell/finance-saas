# Teste local do contêiner único (o mesmo que roda no Render):
#   docker compose -f docker-compose.single.yml up --build
# Abra http://localhost:8081
name: finance-saas-single

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    volumes: [pgdata_single:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://finance:finance@db:5432/finance?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET no arquivo .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET no arquivo .env}
      PORT: 3000
      APP_URL: http://localhost:8081
      TRUST_PROXY: 0   # aqui não há proxy na frente
    depends_on:
      db:
        condition: service_healthy
    ports: ["8081:3000"]

volumes:
  pgdata_single:
