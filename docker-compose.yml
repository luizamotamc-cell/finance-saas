services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://finance:finance@db:5432/finance?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-troque-isto}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-troque-isto}
      CORS_ORIGIN: http://localhost:8080
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports: ["3000:3000"]

  web:
    build: ./apps/web
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
